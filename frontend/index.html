<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContactBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">📒 ContactBook</span>
    </div>
  </nav>

  <main class="container">
    <div class="row g-2 mb-3">
      <div class="col-md-8">
        <input id="search" type="search" class="form-control" placeholder="Rechercher par nom, prénom ou email…">
      </div>
      <div class="col-md-4 text-md-end">
        <button id="btn-add" class="btn btn-success">+ Ajouter un contact</button>
      </div>
    </div>

    <div id="alert" class="alert alert-danger d-none"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th><th>Nom</th><th>Prénom</th><th>Email</th><th>Téléphone</th><th>Adresse</th><th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="contacts"></tbody>
      </table>
    </div>
    <p id="empty" class="text-muted text-center d-none">Aucun contact trouvé.</p>
  </main>

  <!-- Formulaire Ajouter / Modifier -->
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
      <form id="form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">Nouveau contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="f-id">
          <div class="mb-2"><label class="form-label">Nom *</label><input id="f-nom" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Prénom *</label><input id="f-prenom" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Email *</label><input id="f-email" type="email" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Téléphone</label><input id="f-telephone" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Adresse</label><input id="f-adresse" class="form-control"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
